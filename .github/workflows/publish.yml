name: Publish to npmjs & GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "src/**"
      - "migrations/**"
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # dist/ is published; build before registry actions (they use install-deps: false).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Publish to npmjs
        id: npmjs
        uses: dytsou/release/npm-publish@f4ac7961c8c67fc6887ce2265a19d01929960ce5 # v1.3.5 (@v1)
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          install-deps: "false"

      - name: Publish to GitHub Packages
        id: ghpkg
        uses: dytsou/release/github-packages@f4ac7961c8c67fc6887ce2265a19d01929960ce5 # v1.3.5 (@v1)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: "false"
          verify-pack: "false"

      - name: GitHub Release
        if:
          steps.npmjs.outputs.published == 'true' ||
          steps.ghpkg.outputs.published == 'true'
        uses: dytsou/release/github@f4ac7961c8c67fc6887ce2265a19d01929960ce5 # v1.3.5 (@v1)
        with:
          from-package-json: "true"
          move-major-tag: "false"
          body: |
            ## ${{ steps.npmjs.outputs.name }}@${{ steps.npmjs.outputs.version }}

            **Published to multiple registries:**

            - **npmjs.com**: https://www.npmjs.com/package/${{ steps.npmjs.outputs.name }}

            - **GitHub Packages**: https://github.com/${{ github.repository }}/packages

            *Note: If a registry already had this version, it was skipped. Only missing registries were published.*

            ### Install package

            ```bash
            pnpm add ${{ steps.npmjs.outputs.name }}
            ```

            ### Install agent skill

            ```bash
            npx skills add ${{ github.repository }}
            ```

      - name: Publish summary
        if: always()
        run: |
          echo "## Publish Summary"
          echo "### npmjs"
          if [ "${{ steps.npmjs.outputs.skipped }}" == "true" ]; then
            echo "Skipped - version already exists"
          elif [ "${{ steps.npmjs.outputs.published }}" == "true" ]; then
            echo "Published successfully"
          else
            echo "Not published"
          fi
          echo ""
          echo "### GitHub Packages"
          if [ "${{ steps.ghpkg.outputs.skipped }}" == "true" ]; then
            echo "Skipped - version already exists"
          elif [ "${{ steps.ghpkg.outputs.published }}" == "true" ]; then
            echo "Published successfully"
          else
            echo "Not published"
          fi
